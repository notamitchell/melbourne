<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found – eMelbourne</title>
<!--
  Old-URL shim. Most static hosts (GitHub Pages, Netlify, Cloudflare Pages,
  S3 + CloudFront, Apache "ErrorDocument 404 /404.html", nginx "error_page")
  serve this page for any missing path. It maps the old OHRM URLs onto the
  new pages:
     /biogs/EM00187b.htm           -> entry.html?id=EM00187
     /biogs/gallery/EM00187g.htm   -> entry.html?id=EM00187#gallery
     /about.html, /help.html       -> page.html?p=about (Help was retired)
     /browse_*.htm, /search*.htm   -> browse.html, search.html
     /everydaywar/[index.html]     -> page.html?p=everydaywar
     /everydaywar/NAME.html        -> page.html?p=everydaywar-NAME
     /civictreasures/civictreasures.html -> page.html?p=civictreasures
     /letterheads.html, /infocus.html    -> page.html?p=letterheads|infocus
     /objects/D00000891.htm        -> object.html?id=D00000891
  SITE_ROOT is the path the site is served from ("/" on its own domain,
  "/repo-name/" on a GitHub project page). Change it in one place here.
-->
<script>
(function () {
  var SITE_ROOT = "/";
  var p = location.pathname, m;
  // if the site lives below a prefix, work it out from an old top-level folder in the path
  var d = p.match(/^(.*?\/)(biogs|everydaywar|civictreasures|objects)\//i);
  if (d && d[1].length > 1) SITE_ROOT = d[1];
  var target = null;
  if ((m = p.match(/\/objects\/(D\d+)\.html?$/i))) target = "object.html?id=" + m[1].toUpperCase();
  else if (/\/everydaywar\/(index\.html?)?$/i.test(p)) target = "page.html?p=everydaywar";
  else if ((m = p.match(/\/everydaywar\/([\w-]+)\.html?$/i))) target = "page.html?p=everydaywar-" + m[1].toLowerCase();
  else if (/\/civictreasures\/(civictreasures\.html?)?$/i.test(p)) target = "page.html?p=civictreasures";
  else if ((m = p.match(/\/(letterheads|infocus)\.html?$/i))) target = "page.html?p=" + m[1].toLowerCase();
  else if ((m = p.match(/\/biogs\/gallery\/(EM\d{5})g\.html?$/i))) target = "entry.html?id=" + m[1].toUpperCase() + "#gallery";
  else if ((m = p.match(/(EM\d{5})[a-z]?\.html?$/i))) target = "entry.html?id=" + m[1].toUpperCase();
  else if (/\/(about|help)\.html?$/i.test(p)) target = "page.html?p=about";
  else if (/\/browse[^/]*\.html?$/i.test(p)) target = "browse.html";
  else if (/\/search[^/]*\.html?$/i.test(p)) target = "search.html";
  else if (/\/(home|index)\.html?$/i.test(p)) target = "index.html";
  if (target) location.replace(SITE_ROOT + target);
  else document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("home").href = SITE_ROOT + "index.html";
  });
})();
</script>

<body>

</main>
</body>
</html>
